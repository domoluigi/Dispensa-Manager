name: Dispensa Manager
version: "2.0.21"
slug: dispensa_manager
description: Gestione dispensa con barcode scanner, scadenze, lista spesa e autenticazione utenti.
url: https://github.com/domoluigi/Dispensa-Manager
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Permessi per scrivere stati sui sensori HA (sensor.dispensa_*) via SUPERVISOR_TOKEN
homeassistant_api: true

ports:
  5000/tcp: 5000
  5443/tcp: 5443
ports_description:
  5000/tcp: Flask API e frontend (HTTP, usata da Ingress)
  5443/tcp: HTTPS in LAN (solo con ssl attivo; serve alla fotocamera)

ingress: true
ingress_port: 5000
panel_icon: mdi:fridge-outline
panel_title: Dispensa

map:
  - config:rw
  - data:rw
  - ssl:ro

options:
  telegram_token: ""
  telegram_chat_id: ""
  giorni_alert_scadenza: 3
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem

schema:
  telegram_token: password?
  telegram_chat_id: str?
  giorni_alert_scadenza: int?
  ssl: bool?
  certfile: str?
  keyfile: str?

# telegram_token e telegram_chat_id sono gestiti SOLO da qui.
# Le altre impostazioni si modificano dal pannello Admin dell'app.
# La chiave JWT viene generata al primo avvio e conservata nel DB (dalla 2.0.21 non e' piu' un'opzione).
# ssl: true avvia anche HTTPS sulla porta 5443 con certfile/keyfile presi da /ssl
# (es. il certificato dell'add-on Let's Encrypt). Riavviare dopo un rinnovo.
# telegram_token e' di tipo password (mascherato nel form).
# Consigliato: telegram_token: "!secret nome_chiave" per tenerlo in secrets.yaml.
